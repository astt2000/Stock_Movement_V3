name: QST Stock Movement V3

on:
  schedule:
    # Run automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows you to manually trigger it via the GitHub Actions UI tab

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Workspace Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Engine Technical Libraries
        run: |
          python -m pip install --upgrade pip
          
          # 1. Install base required utilities, capping pandas to guarantee stability
          pip install httpx pandas==2.2.2
          
          # 2. Pull the development branch cleanly as a static ZIP archive to completely bypass git credentials/auth errors
          pip install https://github.com/twopirllc/pandas-ta/archive/refs/heads/development.zip

      - name: Execute Python Backend Script
        run: |
          python engine.py

      - name: Save & Commit Status Log Trace
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Generates/Updates a status file to ensure git changes exist so the cron tracks history
          echo "Automated engine run finished: $(date)" > execution_pulse.log
          
          git add execution_pulse.log
          git diff-index --quiet HEAD || git commit -m "Engine execution pass [CRON]"
          git push
