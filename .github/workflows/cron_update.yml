name: QST Stock Movement V3

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Workspace Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Engine Technical Libraries
        run: |
          python -m pip install --upgrade pip
          pip install httpx pandas

      - name: Execute Python Backend Script
        run: |
          python engine.py

      - name: Save & Commit Status Log Trace
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          echo "Automated engine run finished: $(date)" > execution_pulse.log
          git add execution_pulse.log
          git diff-index --quiet HEAD || git commit -m "Engine execution pass [CRON]"
          git push
